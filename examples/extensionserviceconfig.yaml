# Example Talos ExtensionServiceConfig for the frr extension.
#
# This is how FRR gets configured.
#
#   talosctl patch machineconfig -p @extensionserviceconfig.yaml -n <node-ip>
#
# Changing this and re-applying restarts the frr extension service (FRR
# does not support live reload of an externally-swapped config file - see
# README.md "Configuration" section for the interactive vtysh alternative
# for troubleshooting).
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: frr
configFiles:
  - mountPath: /etc/frr/frr.conf
    content: |
      frr defaults traditional
      hostname talos-node-a
      log stdout notifications
      service integrated-vtysh-config
      !
      router bgp 65000
       bgp router-id 10.10.0.1
       no bgp default ipv4-unicast
       !
       neighbor 10.10.11.254 remote-as 65000
       neighbor 10.10.11.254 description R (route-reflector, VLAN1011)
       neighbor 10.10.11.254 bfd
       neighbor 10.10.11.254 timers 3 9
       !
       neighbor 10.10.12.254 remote-as 65000
       neighbor 10.10.12.254 description S (route-reflector, VLAN1012)
       neighbor 10.10.12.254 bfd
       neighbor 10.10.12.254 timers 3 9
       !
       address-family ipv4 unicast
        neighbor 10.10.11.254 activate
        neighbor 10.10.12.254 activate
        network 10.10.0.1/32
       exit-address-family
      !
      bfd
       peer 10.10.11.254
        detect-multiplier 3
        receive-interval 300
        transmit-interval 300
        no shutdown
       !
       peer 10.10.12.254
        detect-multiplier 3
        receive-interval 300
        transmit-interval 300
        no shutdown
       !
      !
      line vty
      !
# Optional: also override which daemons run (defaults to bgpd+bfdd
# enabled, everything but zebra/staticd/mgmtd disabled - see
# rootfs-extra/etc/frr/daemons). Uncomment to add e.g. ospfd:
#
#  - mountPath: /etc/frr/daemons
#    content: |
#      bgpd=yes
#      bfdd=yes
#      ospfd=yes
#      ...
