! Placeholder configuration shipped by the frr-for-talos extension.
!
! This file intentionally configures nothing: no ASN, no neighbors, no
! networks. It exists only so zebra/bgpd/bfdd have a valid integrated
! config to load and start cleanly.
!
! Real, per-node configuration is expected to be supplied at runtime via a
! Talos ExtensionServiceConfig resource that mounts a replacement file over
! this path (/etc/frr/frr.conf) - see examples/extensionserviceconfig.yaml.
! The frr extension service declares `depends: [configuration: true]`, so
! it will not start until an ExtensionServiceConfig for "frr" exists.
!
frr defaults traditional
hostname talos-frr
log stdout notifications
service integrated-vtysh-config
!
line vty
!
